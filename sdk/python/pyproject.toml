[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomivela"
version = "1.0.0"
description = "NOMIVELA Agent Registry SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["nomivela*"]
